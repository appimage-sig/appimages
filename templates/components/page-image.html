{% component ui.page_image(image:string, image_alt:string) %}
{% set c = 'c-page-image' %}
<div class="container">
  <div class="row">
    <div class="col col-12">
      <div class="{{c}} animate">
        <img loading="lazy" src="{{ get_url(path=image) }}" alt="{{ image_alt }}">
      </div>
    </div>
  </div>
{% endcomponent ui.page_image %}
