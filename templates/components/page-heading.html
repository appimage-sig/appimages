{% component ui.page_heading(title: string, description: string, taxonomies: boolean) %}
{% set c = 'c-page-heading' %}
<div class="container">
  <h1 class="{{c}}__title">{{ title }}</h1>
  {% if description %}
    <p class="{{c}}__description">{{ description }}</p>
  {% endif %}
</div>
{% endcomponent ui.page_heading %}
