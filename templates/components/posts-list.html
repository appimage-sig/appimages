{% component ui.posts_list(data: object) %}
{% if data.show_posts %}
<div class="container animate">
  <div class="row" data-pagebreak="6">
    {% for page in paginator.pages or section.pages %}
      {{<ui.blog_card data=page />}}
    {% endfor %}
  </div>
</div>
{{<ui.pagination />}}
{% endif %}
{% endcomponent ui.posts_list %}
