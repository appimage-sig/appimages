{% component posts_list(data, pages=[], paginator=false) %}
{% if data.show_posts %}
<div class="container animate">
  <div class="row" data-pagebreak="6">
    {% for page in pages %}
      {{<blog_card data={page} />}}
    {% endfor %}
  </div>
</div>
{% if paginator %}
  {{<pagination paginator={paginator} />}}
{% endif %}
{% endif %}
{% endcomponent posts_list %}
