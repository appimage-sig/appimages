{% extends "base.html" %}

{% block title %}Authors - {{ config.title }}{% endblock title %}

{% block content %}
<section>
    <h1>Authors</h1>

    {% if terms %}
    <ul class="authors-list">
        {% for term in terms %}
        <li>
            <a href="{{ term.permalink }}">{{ term.name }}</a> ({{ term.pages | length }})
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No authors found.</p>
    {% endif %}
</section>
{% endblock content %}
